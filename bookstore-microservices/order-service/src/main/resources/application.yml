server:
  port: 8083

spring:
  application:
    name: order-service
  profiles:
    active: mock
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true

catalog:
  base-url: ${CATALOG_URL:http://localhost:8082}

inventory:
  base-url: ${INVENTORY_URL:http://localhost:8084}
  mock: ${INVENTORY_MOCK:false}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true